name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pick: [aurora, vesper] # las dos elecciones del Alba se validan en paralelo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sintaxis
        run: npm run check
      - name: Validar que el mapa se puede completar y el orden de jefes (${{ matrix.pick }})
        run: npm run validate
        env:
          PICK: ${{ matrix.pick }}
